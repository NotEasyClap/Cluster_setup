---
- name: setting up kubernetes tools
  hosts: all
  force_handlers: true
  tasks:

    - name: setting up kubectl repository
      yum_repository:
        name: kubernetes
        description: kubernetes
        file: kubernetes
        baseurl: https://pkgs.k8s.io/core:/stable:/v1.37/rpm/
        gpgkey: https://pkgs.k8s.io/core:/stable:/v1.37/rpm/repodata/repomd.xml.key
        gpgcheck: 1
        enabled: 1

    - name: installing the kubectl from repositroy
      yum:
        name:
          - kubectl
          - kubelet
          - kubeadm
        state: latest
      notify: kubelet_service

    - name: bash completion for kubectl & kubeadm
      blockinfile: 
        block: |
          # kubernetes tools completion
          source <(kubectl completion bash)
          alias k=kubectl
          complete -o default -F __start_kubectl k
          source <(kubeadm completion bash) 
        path: ~/.bashrc  
      notify: source_bash
        
    - name: zsh completion for kubectl & kubeadm
      blockinfile: 
        block: |
          # kubernetes tools completion
          source <(kubectl completion zsh)
          alias k=kubectl
          autoload -Uz compinit
          compinit
          source <(kubeadm completion zsh)
        path: ~/.zshrc 
      notify: source_zsh
        
    - name: kubelet service
      service:
        state: started
        enabled: true
        name: kubelet


  handlers:
    - name: kubelet_service
      service:  name=kubelet state=restarted
